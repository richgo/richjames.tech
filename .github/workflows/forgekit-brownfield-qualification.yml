name: Brownfield independent acceptance
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: project
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit
          ref: 1f132c11bacc5fdf77455617f6786849f2f7b327
          path: forgekit-toolchain
          persist-credentials: false
      - name: Validate the reviewed OpenSpec change
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          set -o pipefail
          npm --prefix ../forgekit-toolchain/toolchain/openspec ci --ignore-scripts --engine-strict
          node ../forgekit-toolchain/bin/forgekit.mjs openspec validate --workspace . --optional \
            | tee "$RUNNER_TEMP/acceptance/openspec.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Validate FINOS CALM architecture
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          set -o pipefail
          npx --yes --package @finos/calm-cli@1.68.0 calm validate -a architecture/site.calm.json --format json --strict \
            | tee "$RUNNER_TEMP/acceptance/calm-validation.log"
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/acceptance/browser.json
      - name: Record the source and check scope
        env:
          SOURCE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --arg source "$SOURCE_SHA" --arg head "$PR_HEAD_SHA" \
            '{source: $source, pull_request_head: $head, acceptance: ["AC-001","AC-002","AC-003","AC-004","AC-005","AC-006","AC-007","AC-008"], evidence: "independent website CI"}' \
            > "$RUNNER_TEMP/acceptance/source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-acceptance
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
  attest:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: website-acceptance
          path: ${{ runner.temp }}/acceptance
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/acceptance/*
