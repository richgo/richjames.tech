name: ForgeKit brownfield APMX change
on:
  push:
    tags: ['forgekit-brownfield-proof-*']
permissions: {}
jobs:
  requirements:
    name: SageKit requirements gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit
          ref: f32a6f077edda82575fcfbffa8a825c64312404d
          path: .forgekit-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'sagekit[faiss] @ git+https://github.com/richgo/sage-kit.git@43640fbdf498ab1043237296ad1bf39de5f750c7'
      - name: Pin reviewed source and requirements evidence
        run: |
          python .forge/seed-sagekit.py "$RUNNER_TEMP/corpus"
          python .forge/sagekit-index.py verify "$RUNNER_TEMP/corpus"
          python .forgekit-tooling/factory/sagekit_bridge.py prepare --workspace . \
            --corpus "$RUNNER_TEMP/corpus" --output "$RUNNER_TEMP/sagekit-state"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sagekit-state
          path: ${{ runner.temp }}/sagekit-state
          if-no-files-found: error
  provider:
    name: SageKit TypeSafe provider probe
    needs: requirements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'sagekit @ git+https://github.com/richgo/sage-kit.git@43640fbdf498ab1043237296ad1bf39de5f750c7'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sagekit-state
          path: ${{ runner.temp }}/sagekit-state
      - run: python .forge/seed-sagekit.py "$RUNNER_TEMP/corpus"
      - name: Verify a typed recommendation against the approved requirements
        env:
          SAGEKIT_JEV_URL: https://api.typesafe.ai/v1/systemone
          SAGEKIT_JEV_MODEL: jev-1.13.0
          TYPESAFE_API_KEY: ${{ secrets.FORGE_JEV_TOKEN }}
        run: |
          python .forge/probe-sagekit.py "$RUNNER_TEMP/corpus" \
            "$RUNNER_TEMP/sagekit-state/pin.json" "$RUNNER_TEMP/sagekit-provider.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sagekit-provider-probe
          path: ${{ runner.temp }}/sagekit-provider.json
          if-no-files-found: error
  change:
    needs: requirements
    uses: richgo/forge-kit/.github/workflows/apmx-factory.yml@f32a6f077edda82575fcfbffa8a825c64312404d
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: .
      model: gpt-5.3-codex
      qualification-tag: ${{ github.ref_name }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  release:
    name: SageKit release decision
    needs: [requirements, change]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit
          ref: f32a6f077edda82575fcfbffa8a825c64312404d
          path: .forgekit-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'sagekit @ git+https://github.com/richgo/sage-kit.git@43640fbdf498ab1043237296ad1bf39de5f750c7'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sagekit-state
          path: ${{ runner.temp }}/sagekit-state
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: apmx-receipt
          path: ${{ runner.temp }}/apmx-receipt
      - name: Rebuild the approved corpus
        run: python .forge/seed-sagekit.py "$RUNNER_TEMP/corpus"
      - name: Check the independent receipt and obtain a typed TypeSafe decision
        env:
          RECEIPT_SHA256: ${{ needs.change.outputs.receipt-sha256 }}
          SAGEKIT_JEV_URL: https://api.typesafe.ai/v1/systemone
          SAGEKIT_JEV_MODEL: jev-1.13.0
          TYPESAFE_API_KEY: ${{ secrets.FORGE_JEV_TOKEN }}
        run: |
          python .forgekit-tooling/factory/sagekit_bridge.py complete --workspace . \
            --state "$RUNNER_TEMP/sagekit-state" --output "$RUNNER_TEMP/sagekit-result" \
            --corpus "$RUNNER_TEMP/corpus" --receipt "$RUNNER_TEMP/apmx-receipt/receipt.intoto.jsonl" \
            --receipt-sha256 "$RECEIPT_SHA256"
          cp "$RUNNER_TEMP/sagekit-state/pin.json" "$RUNNER_TEMP/sagekit-result/pin.json"
          printf '%s\n' "$RECEIPT_SHA256" > "$RUNNER_TEMP/sagekit-result/apmx-receipt.sha256"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/sagekit-result/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sagekit-release-gate
          path: ${{ runner.temp }}/sagekit-result
          if-no-files-found: error
