name: Verify committed SageKit FAISS index
on:
  pull_request:
    paths:
      - '.forge/sagekit-index.py'
      - '.forge/seed-sagekit.py'
      - '.forge/sagekit-index/**'
      - '.gitattributes'
      - '.github/workflows/sagekit-index.yml'
      - 'request.md'
      - 'product-requirements.md'
      - 'architecture/README.md'
  push:
    branches: [master]
    paths:
      - '.forge/sagekit-index.py'
      - '.forge/seed-sagekit.py'
      - '.forge/sagekit-index/**'
      - '.gitattributes'
      - '.github/workflows/sagekit-index.yml'
      - 'request.md'
      - 'product-requirements.md'
      - 'architecture/README.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'sagekit[faiss] @ git+https://github.com/richgo/sage-kit.git@43640fbdf498ab1043237296ad1bf39de5f750c7'
      - name: Verify the index against the checked-out sources
        run: |
          python .forge/seed-sagekit.py "$RUNNER_TEMP/corpus"
          python .forge/sagekit-index.py verify "$RUNNER_TEMP/corpus"
